[package]
name = "noral-web"
version = "0.35.0"
edition = "2021"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[dependencies]
wry = "0.46"
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
ureq = { version = "2", default-features = false, features = ["tls"] }
