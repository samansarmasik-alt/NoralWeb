[package]
name = "noral-cli"
version = "0.37.0"
edition = "2021"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

# Çekirdek masaüstünden #[path] ile alınır — kopya yok, hep senkron.
# GUI bağımlılığı YOK: Windows + Linux'ta derlenir.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-big-array = "0.5"
ureq = { version = "2", default-features = false, features = ["tls"] }
