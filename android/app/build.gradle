plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noralweb'
    compileSdk 34

    defaultConfig {
        applicationId 'com.noralweb'
        minSdk 26
        targetSdk 34
        versionCode 39
        versionName '0.37.0'
    }

    // Secret yoksa boş kalır ve kullanılmaz (doğrulama yalnızca seçilende yapılır).
    // buildTypes'tan ÖNCE olmalı (Gradle konfigürasyon sırası).
    signingConfigs {
        surum {
            if (System.getenv("NORAL_KEYSTORE") != null) {
                storeFile file(System.getenv("NORAL_KEYSTORE"))
                storePassword System.getenv("NORAL_STORE_PASS")
                keyAlias 'noral'
                keyPassword System.getenv("NORAL_KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            // CI imzası yok: debug APK doğrudan kurulur.
        }
        release {
            // Kalıcı imza secret'tan gelirse kullanılır (güncellemeler üst üste kurulur),
            // yoksa (yerel derleme) debug imzası düşer.
            signingConfig System.getenv("NORAL_KEYSTORE") != null ? signingConfigs.surum : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Masaüstüyle aynı arayüz: ui/index.html derlemede asset'e kopyalanır (çift kaynak yok).
tasks.register('kopyaArayuz', Copy) {
    from '../../ui/index.html'
    into 'src/main/assets'
    rename { 'index.html' }
}
preBuild.dependsOn('kopyaArayuz')
